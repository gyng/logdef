<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Understory">
  <!--
    A dead CRT with something growing out of it: the setting in two
    shapes. Overgrown *tech*, not wilderness — a bamboo leaf on its own
    described a primeval jungle this game is not set in.

    Vector because the constraint on this asset is "must read at 16
    pixels", where a watercolour wash is mud. It is also ~1 KB against a
    3-5 MB art budget, and the game draws every other pixel procedurally
    today, so a hand-built icon is the honest match for what it is the
    icon of.

    The screen is amber rather than phosphor green because the sprout has
    to be the only green thing for the silhouette to split at tab size —
    an amber CRT is period-correct either way, and `salvage` #d9a25a is
    already the renderer's own colour for a ruin worth stripping.

    Shapes are sized apart on purpose: one bright rectangle, one green
    sprout above it. The stand and the scanline are detail that vanishes
    by 16 px, which is the right way round.

    Palette anchors from the manifest: canopy #12301f, sage #b7cbb0,
    salvaged amber #d9a25a, dead plastic #33453e.
  -->
  <rect width="32" height="32" rx="7" fill="#12301f" />

  <!-- sprout: two leaves and a stem, breaking the top edge of the case -->
  <path d="M16 13.4V6.2" stroke="#b7cbb0" stroke-width="1.5" stroke-linecap="round" />
  <path d="M15.7 8.2C13.3 8.4 11.4 7 10.7 4.8C13.3 4.1 15.3 5.5 15.7 8.2Z" fill="#b7cbb0" />
  <path d="M16.4 10.2C18.4 9.6 19.6 7.9 19.5 5.6C17 6 15.9 7.7 16.4 10.2Z" fill="#b7cbb0" />

  <!-- the case: a chunky 4:3 CRT on a stand, its screen still lit.
       The stand and the deep even bezel are what stop this reading as
       a planter box, which a squatter first pass did. -->
  <rect x="13.2" y="26.4" width="5.6" height="2.4" rx="0.8" fill="#33453e" />
  <rect x="6.4" y="12.8" width="19.2" height="14.4" rx="2.4" fill="#33453e" />
  <rect x="9.1" y="15.3" width="13.8" height="9.4" rx="1.5" fill="#d9a25a" />
  <path d="M10.5 21.6H21.5" stroke="#33453e" stroke-width="1" stroke-linecap="round" opacity="0.3" />
</svg>
