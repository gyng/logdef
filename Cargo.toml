[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
