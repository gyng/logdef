# Determinism enforcement (see implementation-decisions.md §19)
# HashMap/HashSet iteration order is non-deterministic — use Vec or BTreeMap.
disallowed-types = [
    { path = "std::collections::HashMap", reason = "Non-deterministic iteration order breaks simulation determinism. Use Vec or BTreeMap." },
    { path = "std::collections::HashSet", reason = "Non-deterministic iteration order breaks simulation determinism. Use Vec or BTreeSet." },
]
