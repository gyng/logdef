name: Pages

# Publishes the same bundle `make release` zips for itch.io, to GitHub
# Pages instead. There is no separate "web build" — `web/dist` is the
# artifact both targets ship, and the only difference is what wraps it.
#
# **Why this can work at all**, since a WASM game on a static host
# usually cannot:
#
# - `vite.config.ts` sets `base: "./"`, so the bundle asks for
#   `./assets/…` rather than `/assets/…`. Pages serves a project site
#   from `/<repo>/`, which would 404 every absolute path. That setting
#   exists for itch (an unpredictable path inside an iframe) and solves
#   this for free.
# - The wasm glue loads via `new URL('…_bg.wasm', import.meta.url)`,
#   which Vite rewrites to a hashed relative asset, and falls back from
#   `instantiateStreaming` to `arrayBuffer()` if the MIME type is wrong.
#   Pages sends `application/wasm` correctly, but the fallback means a
#   host that does not is survivable rather than fatal.
# - `understory-core` has no threads (`AGENTS.md` §V), so there is no
#   `SharedArrayBuffer` and no need for COOP/COEP headers — which Pages
#   cannot set, and which is the usual reason a WASM game will not run
#   there.
#
# No `.nojekyll` is needed: `actions/deploy-pages` serves the uploaded
# artifact directly and never runs Jekyll. (It would matter for the
# older deploy-from-a-branch setup, and `web/dist` has no
# underscore-prefixed files either way.)

on:
  push:
    branches: [v2]
  # So a deploy can be re-run without an empty commit — useful when the
  # Pages settings change rather than the code.
  workflow_dispatch:

# The three `deploy-pages` needs. `contents: read` is the default
# checkout permission stated explicitly, because the block replaces the
# default set rather than adding to it.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight: a half-applied
# Pages deployment is a broken site, unlike a cancelled test run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # **Deliberately no `needs: [rust, frontend]`.** Those live in
      # ci.yml and run on the same push; wiring this to them would make
      # a deploy wait on a Playwright suite that takes minutes and has
      # nothing to do with whether the bundle builds. CI failing is
      # visible on its own, and a green deploy of a red commit is a
      # smaller problem than a deploy pipeline nobody trusts to finish.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Same install path as ci.yml: the official script, maintained by the
      # wasm-pack project, fetching a prebuilt binary rather than a
      # from-source `cargo install`.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Identical to `make wasm`. **No `--dev`**, so this is wasm-pack's
      # default release profile with `wasm-opt` — which is what the
      # 1.6 MB bundle in `web/dist` assumes. A dev build would deploy
      # and would be several times larger.
      - name: Build WASM bridge
        run: wasm-pack build crates/bridge --target web --out-dir ../../web/pkg

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      # `web/pkg` is generated by the step above and gitignored, so this
      # must not run before it — the import would resolve to nothing and
      # Vite would fail at build rather than at runtime, which is at
      # least the loud way round.
      - name: npm run build
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
